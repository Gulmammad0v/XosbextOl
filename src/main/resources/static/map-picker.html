<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Restoran ünvanını seçin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3ynh8yrJpOlP0jrR0ADZOQAKHf9Vg=" crossorigin="">
  <style>
    *{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:system-ui,sans-serif;color:#2d2923}.panel{position:fixed;z-index:1000;left:14px;right:14px;bottom:18px;background:#fffdf8;border:1px solid #e4dac7;border-radius:18px;padding:14px;box-shadow:0 8px 30px #21180d30}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.value{font-weight:750;font-size:14px}.hint{color:#756d61;font-size:12px;margin-top:3px}.button{border:0;border-radius:12px;padding:12px 16px;background:#85672f;color:#fff;font-weight:800}.error{color:#9b4b45;font-size:13px;margin-top:8px}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel"><div class="row"><div><div class="value" id="value"></div><div class="hint">Xəritəyə toxunaraq dəqiq nöqtəni dəyişin</div></div><button class="button" id="confirm">Bu konumu seç</button></div><div class="error" id="error"></div></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const params=new URLSearchParams(location.search);
    let latitude=Number(params.get('latitude'))||40.4093,longitude=Number(params.get('longitude'))||49.8671;
    const callback=params.get('callback')||'';
    const map=L.map('map').setView([latitude,longitude],15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    const marker=L.marker([latitude,longitude],{draggable:true}).addTo(map);
    const show=()=>document.getElementById('value').textContent=latitude.toFixed(6)+', '+longitude.toFixed(6);
    const select=value=>{latitude=value.lat;longitude=value.lng;marker.setLatLng(value);show()};
    map.on('click',event=>select(event.latlng));marker.on('dragend',()=>select(marker.getLatLng()));show();
    document.getElementById('confirm').onclick=()=>{try{const target=new URL(callback);if(!['xosbextol:','exp:'].includes(target.protocol))throw new Error('Etibarsız geri dönüş ünvanı');target.searchParams.set('latitude',String(latitude));target.searchParams.set('longitude',String(longitude));location.href=target.toString()}catch(error){document.getElementById('error').textContent=error.message||String(error)}};
  </script>
</body>
</html>
